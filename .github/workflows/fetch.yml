name: 每週抓 Tesla 官網台灣站點
on:
  schedule:
    - cron: "17 17 * * 0"   # 每週日 17:17 UTC = 台灣週一 01:17
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch.mjs
      - name: 存檔
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/tesla.json
          git diff --cached --quiet || git commit -m "Tesla 站點資料 $(date -u +%F)"
          git push
